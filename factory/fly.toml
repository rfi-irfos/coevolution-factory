# fly.toml app configuration file generated for coevolution-factory-sparkling-mountain-1802 on 2026-07-16T21:59:09+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'coevolution-factory-sparkling-mountain-1802'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = "factory_data"
  destination = "/data"

[env]
  FT_ENGINE_KEY = 'local'
  FT_ENGINE_URL = 'https://lauras-agents-api-v2.fly.dev'
  FT_PORT = '8091'
  FT_STATE_DIR = '/data'

[deploy]
  # Keep the app running so the in-app autonomous scheduler
  # (reflect/spawn/briefing/evolve loops) fires without external cron machines.
  min_machines_running = 1
  auto_stop_machines = false

[[services]]
  protocol = 'tcp'
  internal_port = 8091
  processes = ['app']
  # The app imports 50 centers + the registry + factory_spawn_agent
  # on boot (aiohttp + catalog expansion + feedparser lazy), which on
  # a 512MB shared-CPU machine can take >90s. Give the smoke
  # check a long grace period so the slow start doesn't trip the
  # "not listening" WARNING on every deploy.
  [services.healthchecks]
    grace_period = "180s"
    interval = "30s"
    timeout = "10s"
    path = "/health"

[[processes]]
  key = 'app'
  command = 'python runtime.py'

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 100

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

# All autonomous loops (reflect/spawn/briefing/evolve) now run INSIDE the
# app via the in-app scheduler (app.on_startup). No external cron machines
# or deploy.schedules needed — the app self-drives as long as it's live.
