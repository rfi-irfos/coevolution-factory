# fly.toml app configuration file generated for coevolution-factory-sparkling-mountain-1802 on 2026-07-16T21:59:09+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'coevolution-factory-sparkling-mountain-1802'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = "factory_data"
  destination = "/data"

[env]
  FT_ENGINE_KEY = 'local'
  FT_ENGINE_URL = 'https://lauras-agents-api.fly.dev'
  FT_PORT = '8091'
  FT_STATE_DIR = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8091
  processes = ['app']
  # The app imports 50 centers + the registry on boot (aiohttp + catalog
  # expansion), which on a 512MB shared-CPU machine can take >30s.
  # Give the smoke check a longer grace period so the slow start doesn't
  # trip the "not listening" WARNING on every deploy.
  [services.healthchecks]
    grace_period = "90s"
    interval = "30s"
    timeout = "10s"
    path = "/health"

[[processes]]
  key = 'app'
  command = 'python runtime.py'

[[processes]]
  key = 'briefing'
  command = 'python daily_brief.py'

[[processes]]
  key = 'spawn'
  command = 'python daily_spawn.py'

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 100

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

# Autonomous schedules (separate from the daily-evolve cron job that
# runs via `fly machine exec` / the Hermes cron).
#
# 1. Briefings: pull real regulatory/security feeds, convene the panel,
#    publish. Every 4h.
# 2. FACTORY-FACTORY: scan real trends/regulation, detect gaps, STAGE a
#    candidate daughter-center. LAURA-GATED before promotion (the
#    daily_spawn cron calls mcp_laura_review_plan; only 0-FLAG candidates
#    are born). Runs daily at 02:00, before daily_evolve (03:00).
[[deploy.schedules]]
  process = 'briefing'
  cron = '17 */4 * * *'

[[deploy.schedules]]
  process = 'spawn'
  cron = '0 2 * * *'
